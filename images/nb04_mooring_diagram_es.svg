<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Vista en planta de un buque amarrado a un muelle con dos líneas de amarre, T1 a 30 grados y T2 a 150 grados respecto a la crujía, y una fuerza ambiental de 40 kilonewtons a 200 grados empujando el buque fuera del muelle.">
<rect x="0" y="0" width="900" height="520" fill="#0d2b46" stroke="#4d6b85" stroke-width="3"></rect>
<defs>
<pattern id="hatchNB04" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
<line x1="0" y1="0" x2="0" y2="10" stroke="rgba(234,242,248,0.28)" stroke-width="1"></line>
</pattern>
<marker id="arrowTensionNB04" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e0ac5f"></path>
</marker>
<marker id="arrowForceNB04" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#ff7a54"></path>
</marker>
<marker id="arrowRefNB04" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6f8ba3"></path>
</marker>
</defs>
<rect x="40" y="118" width="820" height="97" fill="url(#hatchNB04)"></rect>
<line x1="40" y1="215" x2="860" y2="215" stroke="#eaf2f8" stroke-width="2.5"></line>
<text x="450" y="152" text-anchor="middle" fill="#a9c1d4" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="15" letter-spacing="0.14em">MUELLE</text>
<g stroke="#7fd1e0" fill="#7fd1e0">
<circle cx="764" cy="215" r="5.5"></circle>
<rect x="760.5" y="215" width="7" height="12" fill="#7fd1e0"></rect>
<circle cx="71" cy="215" r="5.5"></circle>
<rect x="67.5" y="215" width="7" height="12" fill="#7fd1e0"></rect>
</g>
<line x1="70" y1="380" x2="845" y2="380" stroke="#6f8ba3" stroke-width="1.3" stroke-dasharray="1 5"></line>
