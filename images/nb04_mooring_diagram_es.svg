<circle cx="440" cy="380" r="3.5" fill="#ff7a54"></circle>
<text x="272" y="463" text-anchor="middle" fill="#ff7a54" font-family="Menlo,Consolas,monospace" font-weight="600" font-size="13">F = 40 kN</text>
</svg>