<text x="410" y="384" text-anchor="middle" fill="#a9c1d4" font-family="Helvetica,Arial,sans-serif" font-weight="600" font-size="13" letter-spacing="0.1em">BUQUE</text>
<line x1="560" y1="333" x2="630" y2="333" stroke="#6f8ba3" stroke-width="1" stroke-dasharray="1 4"></line>
